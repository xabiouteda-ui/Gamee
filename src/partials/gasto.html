<section class="tool card gasto" id="tool" aria-label="Calculadora de consumo">
  <div class="gasto-form">
    <label class="wide">Aparato
      <select id="g-app"></select>
    </label>
    <label>Potencia (W)
      <input type="number" id="g-w" min="1" max="20000" step="1" inputmode="numeric">
    </label>
    <label>Horas de uso al día
      <input type="number" id="g-h" min="0" max="24" step="0.05" inputmode="decimal">
    </label>
    <label>Días de uso al mes
      <input type="number" id="g-d" min="1" max="31" step="1" value="30" inputmode="numeric">
    </label>
    <label>Precio de la energía (€/kWh, sin impuestos)
      <input type="number" id="g-p" min="0.01" max="1" step="0.001" inputmode="decimal">
      <span class="muted small" id="g-p-src"></span>
    </label>
  </div>
  <div class="gasto-result" id="g-result" aria-live="polite"></div>
  <p class="muted small" id="g-note"></p>
</section>
