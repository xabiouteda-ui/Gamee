<section class="tool card itp" id="calculadora" aria-label="Calculadora del ITP de vehículos usados">
  <form class="itp-form" id="itp-form" novalidate>
    <p class="muted small itp-sample"><span id="itp-sample-note">Rellenado con un ejemplo: compacto de gasolina de 2021 comprado en Madrid.</span> <button type="button" class="linklike" id="itp-clear">Empezar con mis datos</button></p>
    <div class="gasto-form">
      <label>Comunidad donde vive el comprador
        <select id="itp-ccaa">
          <option value="andalucia">Andalucía</option>
          <option value="aragon">Aragón</option>
          <option value="asturias">Asturias</option>
          <option value="baleares">Illes Balears</option>
          <option value="canarias">Canarias</option>
          <option value="cantabria">Cantabria</option>
          <option value="clm">Castilla-La Mancha</option>
          <option value="cyl">Castilla y León</option>
          <option value="cataluna">Cataluña</option>
          <option value="valencia">Comunitat Valenciana</option>
          <option value="extremadura">Extremadura</option>
          <option value="galicia">Galicia</option>
          <option value="madrid" selected>Comunidad de Madrid</option>
          <option value="murcia">Región de Murcia</option>
          <option value="rioja">La Rioja</option>
          <option value="ceuta">Ceuta</option>
          <option value="melilla">Melilla</option>
          <option value="navarra">Navarra</option>
          <option value="paisvasco">País Vasco</option>
        </select>
      </label>
      <label>Tipo de vehículo
        <select id="itp-tipo">
          <option value="turismo">Turismo o todoterreno</option>
          <option value="moto">Motocicleta</option>
          <option value="ciclomotor">Ciclomotor</option>
        </select>
      </label>
      <label>Primera matriculación
        <input type="date" id="itp-matric" value="2021-05-20">
        <span class="muted small">Viene en el permiso de circulación.</span>
      </label>
      <label>Fecha de la compraventa
        <input type="date" id="itp-venta">
      </label>
      <label>Precio de compra (€)
        <input type="number" id="itp-precio" min="0" step="50" inputmode="decimal" value="7500">
      </label>
      <label>Valor de tablas de Hacienda (€)
        <input type="number" id="itp-tablas" min="0" step="50" inputmode="decimal" value="22400">
        <span class="muted small">Precio del modelo nuevo en la Orden HAC/1501/2025. Opcional, pero sin él el resultado puede quedarse corto.</span>
      </label>
      <label>Cilindrada (cc)
        <input type="number" id="itp-cc" min="0" step="1" inputmode="numeric" value="1498">
      </label>
      <label>Potencia fiscal (CVF)
        <input type="number" id="itp-cvf" min="0" step="0.01" inputmode="decimal" value="10.25">
        <span class="muted small">Caballos fiscales, no CV de motor.</span>
      </label>
      <label>Etiqueta ambiental de la DGT
        <select id="itp-etiqueta">
          <option value="otra" selected>B, C o sin etiqueta</option>
          <option value="eco">ECO</option>
          <option value="cero">0 emisiones</option>
        </select>
      </label>
      <label class="itp-check"><input type="checkbox" id="itp-historico"> Está catalogado como vehículo histórico</label>
    </div>
  </form>

  <div class="itp-slip" aria-live="polite">
    <div class="itp-slip-head"><span>Modelo 620 · estimación</span><span id="itp-slip-ccaa">Comunidad de Madrid</span></div>
    <div class="itp-total">
      <span class="muted small">Impuesto a pagar</span>
      <strong id="itp-amount">—</strong>
      <span id="itp-badge"></span>
    </div>
    <ul class="itp-lines" id="itp-lines"></ul>
    <div class="itp-notes" id="itp-notes"></div>
  </div>
  <noscript><p>Esta calculadora necesita JavaScript. Mientras, consulta la tabla de tipos de cada comunidad más abajo.</p></noscript>
</section>
