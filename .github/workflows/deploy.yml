name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      # Si defines la variable SITE_URL en Settings → Secrets and variables → Actions → Variables
      # (p. ej. https://www.tudominio.com), se usa para canonical, sitemap y Open Graph.
      # Si no, se usa la URL que GitHub Pages asigna al repositorio.
      - name: Generar la web
        run: node build.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL || steps.pages.outputs.base_url }}

      - name: Comprobaciones
        run: node tests/check-site.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
