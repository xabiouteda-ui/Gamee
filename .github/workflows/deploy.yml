name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # Cada día, después de que Red Eléctrica publique los precios del PVPC de mañana (~20:15 hora peninsular),
  # se vuelve a publicar la web con data/pvpc.json actualizado. (Los cron solo se ejecutan en la rama principal.)
  schedule:
    - cron: "35 19 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Historial completo: el sitemap usa la fecha del último commit de cada página como lastmod.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5

      # La URL pública sale de site.config.json (siteOrigin + basePath). Para cambiarla sin tocar el código,
      # define las variables SITE_ORIGIN y/o BASE_PATH en Settings → Secrets and variables → Actions → Variables.
      # Precios horarios del PVPC (API pública de REE). Si falla, reutiliza los ya publicados; nunca rompe el build.
      - name: Descargar precios del PVPC
        run: node scripts/fetch-pvpc.mjs
        env:
          PVPC_FALLBACK_URL: ${{ steps.pages.outputs.base_url }}/data/pvpc.json

      - name: Generar la web
        run: node build.mjs
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          BASE_PATH: ${{ vars.BASE_PATH }}

      # Aviso (no bloquea) si la URL configurada no coincide con la que GitHub Pages asigna a este repositorio.
      - name: Comprobar URL base
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          SITE=$(sed -n 's/.*canonical" href="\([^"]*\)".*/\1/p' _site/index.html)
          echo "URL configurada: $SITE"
          echo "URL de GitHub Pages: $PAGES_URL/"
          # Se compara sin el esquema: con dominio propio, GitHub Pages devuelve http:// hasta que se marca «Enforce HTTPS».
          if [ "$(echo "${SITE%/}" | sed 's#^https\?://##')" != "$(echo "${PAGES_URL%/}" | sed 's#^https\?://##')" ]; then
            echo "::warning::La URL configurada ($SITE) no coincide con la de GitHub Pages ($PAGES_URL/). Revisa siteOrigin/basePath en site.config.json, las variables SITE_ORIGIN/BASE_PATH o el dominio propio."
          elif [ "${PAGES_URL#https://}" = "$PAGES_URL" ]; then
            echo "::notice::GitHub Pages sirve el dominio sin HTTPS obligatorio. Activa Settings → Pages → Enforce HTTPS."
          fi

      - name: Comprobaciones
        run: |
          node tests/check-site.mjs
          node tests/unit-captions.mjs
          node tests/unit-luz.mjs
          node tests/unit-monetizacion.mjs
          node tests/unit-seo.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4

      # Aviso a Bing y otros buscadores con IndexNow (Google no lo usa: para Google, el sitemap en Search Console).
      # Tras un push, todas las URL; en el despliegue diario, solo las páginas con precios del día. Nunca falla.
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Avisar a IndexNow
        run: node scripts/indexnow.mjs ${{ github.event_name == 'schedule' && 'today' || 'all' }}
        env:
          SITE_ORIGIN: ${{ vars.SITE_ORIGIN }}
          BASE_PATH: ${{ vars.BASE_PATH }}
